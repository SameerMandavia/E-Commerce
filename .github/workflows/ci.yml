name: CI
on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew clean build
      - name: Run tests
        run: ./gradlew test
